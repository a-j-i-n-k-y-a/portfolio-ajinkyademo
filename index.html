<body>

    <script>
        // --- CONFIGURATION ---
        const autoSpeed = 0.5;        
        const scrollMultiplier = 0.8; 
        
        const columns = document.querySelectorAll('.image-column');
        
        // Store the column heights so we don't re-calculate them every frame (Fixes Jitter)
        let columnHeights = [];
    
        // State variables
        let currentScroll = 0;
        let targetScroll = 0;
        let isDragging = false;
    
        // 1. INITIAL SETUP (Wait for images to load!)
        window.onload = function() {
            columns.forEach((col, index) => {
                // Clone images for infinite loop
                col.innerHTML += col.innerHTML;
                
                // Measure height AFTER cloning and loading
                // We store half the height because that's our loop point
                columnHeights[index] = col.scrollHeight / 2;
            });
    
            // Start the loop only after setup is done
            requestAnimationFrame(animate);
        };
    
        // 2. HANDLE RESIZE (If user resizes window, re-measure heights)
        window.addEventListener('resize', () => {
            columns.forEach((col, index) => {
                columnHeights[index] = col.scrollHeight / 2;
            });
        });
    
        // 3. THE RENDER LOOP
        function animate() {
            targetScroll += autoSpeed;
            currentScroll += (targetScroll - currentScroll) * 0.1;
    
            columns.forEach((col, index) => {
                const loopHeight = columnHeights[index];
                
                // Safety check: If height is 0 (images not loaded yet), don't run
                if (!loopHeight) return;
    
                const yPos = currentScroll % loopHeight;
                
                // USE TRANSLATE3D: This forces the GPU to handle the movement (Smoother)
                col.style.transform = `translate3d(0, -${yPos}px, 0)`;
            });
    
            requestAnimationFrame(animate);
        }
    
        // 4. USER INTERACTION LISTENERS
        window.addEventListener('wheel', (e) => {
            targetScroll += e.deltaY * scrollMultiplier;
        });
    
        let startY = 0;
        window.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
        });
    
        window.addEventListener('touchmove', (e) => {
            if(!isDragging) return;
            const y = e.touches[0].clientY;
            const delta = startY - y;
            targetScroll += delta * 1.5;
            startY = y;
        });
    
        window.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>

</body>
</html>
